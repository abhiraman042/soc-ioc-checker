name: SOC IOC Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  check-iocs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate API key is present
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [ -z "$VIRUSTOTAL_API_KEY" ]; then
            echo "::error::VIRUSTOTAL_API_KEY secret is missing or empty"
            exit 1
          fi

      - name: Run IOC Checker
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: python ioc_checker.py

      - name: Verify report files exist
        if: always()
        run: |
          ls -la results.csv results.xlsx 2>&1 || true
          if [ ! -f results.csv ] && [ ! -f results.xlsx ]; then
            echo "::error::No report files were produced by ioc_checker.py"
            exit 1
          fi

      - name: Upload IOC Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soc-ioc-reports-${{ github.run_number }}
          path: |
            results.csv
            results.xlsx
          if-no-files-found: error
          retention-days: 7
