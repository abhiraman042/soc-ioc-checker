
name: SOC IOC Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  check-iocs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IOC Checker
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: python ioc_checker.py

      - name: Upload IOC Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soc-ioc-reports
          path: |
            results.csv
            results.xlsx
          if-no-files-found: warn
          retention-days: 7
